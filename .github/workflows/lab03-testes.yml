name: Testes Lab03

on:
  push:
    paths:
      - 'Laboratorio03_MineracaoDeMetricasDORA/**'
      - '.github/workflows/lab03-testes.yml'
  pull_request:
    paths:
      - 'Laboratorio03_MineracaoDeMetricasDORA/**'
      - '.github/workflows/lab03-testes.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Laboratorio03_MineracaoDeMetricasDORA
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Executar testes automatizados com cobertura mínima de 80%
        run: python -m pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
