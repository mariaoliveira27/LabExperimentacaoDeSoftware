name: testes

on:
  push:
    paths:
      - 'Laboraorio03_MineracaoDeMetricasDORA/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Laboraorio03_MineracaoDeMetricasDORA/**'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r Laboraorio03_MineracaoDeMetricasDORA/requirements.txt

      - name: Executar testes automatizados com cobertura mínima de 80%
        run: |
          cd Laboraorio03_MineracaoDeMetricasDORA
          pytest --cov=metricas --cov-report=term-missing --cov-fail-under=80
